name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Job
    runs-on: ubuntu-latest

    # Add permissions required for Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install

    - name: Build Web Assets
      run: |
        npm run build
        # Inject Cloud Run API URL
        sed -i 's|const API_BASE = "";|const API_BASE = "https://nutrisnap-ai-940406235442.us-central1.run.app";|g' www/index.html

    - name: Add Android Platform
      run: |
        npx cap add android

    - name: Replace App Icon
      run: |
        # Delete default adaptive XML folder to prevent override on API 26+ devices and duplicate resource conflicts
        rm -rf android/app/src/main/res/mipmap-anydpi-v26
        
        # Clean any existing template icons (png, webp, xml) to prevent duplicate resource compilation conflicts (AAPT2)
        find android/app/src/main/res/ -name "ic_launcher*" -delete
        
        # Copy Light Mode Icons
        mkdir -p android/app/src/main/res/mipmap-mdpi
        cp android-icons/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        cp android-icons/mipmap-mdpi/ic_launcher_round.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
        
        mkdir -p android/app/src/main/res/mipmap-hdpi
        cp android-icons/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp android-icons/mipmap-hdpi/ic_launcher_round.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
        
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        cp android-icons/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
        cp android-icons/mipmap-xhdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
        
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        cp android-icons/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        cp android-icons/mipmap-xxhdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
        
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi
        cp android-icons/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        cp android-icons/mipmap-xxxhdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
        
        # Create Night Mode Directories and Copy Night Mode Icons
        mkdir -p android/app/src/main/res/mipmap-mdpi-night
        cp android-icons/mipmap-mdpi-night/ic_launcher.png android/app/src/main/res/mipmap-mdpi-night/ic_launcher.png
        cp android-icons/mipmap-mdpi-night/ic_launcher_round.png android/app/src/main/res/mipmap-mdpi-night/ic_launcher_round.png
        
        mkdir -p android/app/src/main/res/mipmap-hdpi-night
        cp android-icons/mipmap-hdpi-night/ic_launcher.png android/app/src/main/res/mipmap-hdpi-night/ic_launcher.png
        cp android-icons/mipmap-hdpi-night/ic_launcher_round.png android/app/src/main/res/mipmap-hdpi-night/ic_launcher_round.png
        
        mkdir -p android/app/src/main/res/mipmap-xhdpi-night
        cp android-icons/mipmap-xhdpi-night/ic_launcher.png android/app/src/main/res/mipmap-xhdpi-night/ic_launcher.png
        cp android-icons/mipmap-xhdpi-night/ic_launcher_round.png android/app/src/main/res/mipmap-xhdpi-night/ic_launcher_round.png
        
        mkdir -p android/app/src/main/res/mipmap-xxhdpi-night
        cp android-icons/mipmap-xxhdpi-night/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi-night/ic_launcher.png
        cp android-icons/mipmap-xxhdpi-night/ic_launcher_round.png android/app/src/main/res/mipmap-xxhdpi-night/ic_launcher_round.png
        
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi-night
        cp android-icons/mipmap-xxxhdpi-night/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi-night/ic_launcher.png
        cp android-icons/mipmap-xxxhdpi-night/ic_launcher_round.png android/app/src/main/res/mipmap-xxxhdpi-night/ic_launcher_round.png

    - name: Patch Android Manifest Permissions
      run: |
        python patch_manifest.py

    - name: Build APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Copy APK to Static Assets
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk static/app-debug.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Authenticate with Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/940406235442/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-actions-deployer@tensile-imprint-496808-v5.iam.gserviceaccount.com'

    - name: Set up gcloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: 'tensile-imprint-496808-v5'

    - name: Build and Push with Cloud Build
      run: |
        gcloud builds submit --config cloudbuild.yaml . --region us-central1

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy nutrisnap-ai \
          --image gcr.io/tensile-imprint-496808-v5/nutrisnap-ai:v4 \
          --region us-central1 \
          --allow-unauthenticated
